# Add only when enabling the hosted embedding endpoint with its private CA.
# This override configures the agent service only; retrieval remains team-owned.
services:
  agent:
    environment:
      EMBEDDING_CA_CERT: /certificate/embedding.crt
    volumes:
      - type: bind
        source: ${EMBEDDING_CA_CERT:?Set EMBEDDING_CA_CERT to the host embedding CA file}
        target: /certificate/embedding.crt
        read_only: true
        bind:
          create_host_path: false
