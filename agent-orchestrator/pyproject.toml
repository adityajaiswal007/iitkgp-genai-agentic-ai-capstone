[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "regulatory-agent"
version = "0.1.0"
description = "Qwen3 regulatory document orchestration with a FastAPI execution API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "langgraph==1.2.20",
  "langgraph-checkpoint-sqlite==3.1.3",
  "pydantic==2.14.3",
  "openai==2.54.0",
  "fastapi==0.162.2",
  "uvicorn==0.54.0",
  "httpx>=0.28,<1",
  "python-dotenv==1.2.4",
]

[project.optional-dependencies]
test = ["pytest==9.2.0", "httpx==0.28.1", "trustme>=1.2,<2"]
notebook = ["nbformat==5.11.1", "nbclient==0.11.0", "ipykernel==7.4.0", "jupyterlab>=4.4,<5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
