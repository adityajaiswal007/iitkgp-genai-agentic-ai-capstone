[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "regassist-rag"
version = "0.1.0"
description = "Hybrid retrieval service for RegAssist over the RBI and income-tax corpora"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic>=2.7,<3",
  "httpx>=0.28,<1",
  "pypdfium2>=4.30,<6",
  "numpy>=1.26,<3",
  "snowballstemmer>=2.2,<4",
]

[project.optional-dependencies]
ocr = ["pytesseract>=0.3.10", "pillow>=10"]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
